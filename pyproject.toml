[project]
name = "konstanz-parking"
version = "0.1.0"
description = "What drives parking occupancy in Konstanz? Weather, weekdays and Swiss shopping tourism."
authors = [
    { name = "İrem", email = "irem11314@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
konstanz-parking = "konstanz_parking:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
