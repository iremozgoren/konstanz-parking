name: collect

# Polls all parking sources every 15 minutes and commits raw snapshots to the `data` branch.
# GitHub cron is best-effort: runs may be delayed or skipped. Every run logs its actual
# timestamps to data/raw/runs/<date>.jsonl so gaps are detectable.
# Minutes are offset from :00 because the top of the hour is GitHub's busiest time.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out collector code (main)
        uses: actions/checkout@v7

      - name: Compute UTC dates for sparse checkout
        id: dates
        run: |
          echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "tomorrow=$(date -u -d tomorrow +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Only today's (and tomorrow's, for runs crossing midnight) daily files are needed to
      # append, so the checkout stays small no matter how large the data branch grows.
      - name: Check out data branch (sparse)
        uses: actions/checkout@v7
        with:
          ref: data
          path: data-branch
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /README.md
            /data/raw/*/${{ steps.dates.outputs.today }}.jsonl
            /data/raw/*/${{ steps.dates.outputs.tomorrow }}.jsonl

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true

      - name: Collect snapshots
        # The collector itself never fails on bad responses; failures are recorded as data
        # and surfaced as warning annotations.
        run: uv run --frozen konstanz-parking collect --data-dir data-branch/data/raw

      - name: Commit and push to data branch
        working-directory: data-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse data/raw
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -q -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ) (run ${{ github.run_id }})"
          for attempt in 1 2 3 4 5; do
            if git push -q origin HEAD:data; then exit 0; fi
            echo "push failed (attempt $attempt), rebasing and retrying"
            sleep $((attempt * 5))
            git pull -q --rebase origin data
          done
          echo "::error::could not push snapshot to data branch"
          exit 1
